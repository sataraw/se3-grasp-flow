[project]
name = "graspgen"
version = "0.1.0"
description = "Few-step SE(3)-equivariant grasp generation (EquiGraspFlow -> GraspMeanFlow) on ACRONYM, evaluated in MuJoCo"
readme = "README.md"
authors = [
    { name = "Georgii Fatakhov" },
    { name = "Awar Satar" },
]
requires-python = ">=3.10,<3.11"
dependencies = [
    # Deep learning
    "torch>=2.7",
    "numpy==1.26.*",
    "scipy",
    "roma",
    # EquiGraspFlow reference code (third_party/EquiGraspFlow)
    "open3d==0.16.0",  # partial point clouds assert exactly 0.16
    "h5py",
    "omegaconf",
    "pyyaml",
    "tensorboardX",
    "tensorboard",
    "tqdm",
    "pandas",
    "openpyxl",
    "plotly",
    # Simulation and geometry
    "mujoco",
    "trimesh",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

# torch with CUDA 12.8 (needed for the RTX 50xx / Blackwell GPUs); same wheels on Linux cloud VMs.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Pylance/pyright: resolve EquiGraspFlow's top-level packages (`models`, `utils`, ...), which
# graspgen.egf puts on sys.path at runtime.
[tool.pyright]
extraPaths = ["src", "third_party/EquiGraspFlow"]

[tool.ruff]
line-length = 110
extend-exclude = ["third_party"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
